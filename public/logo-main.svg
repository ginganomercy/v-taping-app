<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-size: 52px;
        letter-spacing: 0.18em;
      }
    </style>
    <linearGradient id="mainVtLeft" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#D91B3A" />
      <stop offset="0.55" stop-color="#C8102E" />
      <stop offset="1" stop-color="#8B0A1F" />
    </linearGradient>
    <linearGradient id="mainVtRight" x1="0.85" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#C8102E" />
      <stop offset="0.6" stop-color="#A50D26" />
      <stop offset="1" stop-color="#6E0818" />
    </linearGradient>
    <linearGradient id="mainVtFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B0A1F" />
      <stop offset="1" stop-color="#4A0510" />
    </linearGradient>
    <radialGradient id="mainVtGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.16" />
      <stop offset="1" stop-color="#C8102E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mainVtShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.45" />
      <stop offset="1" stop-color="#C8102E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Obsidian Background -->
  <rect width="900" height="900" fill="#0A0A0A" />

  <!-- Centered Emblem (viewBox 0 0 600 600 scaled to 500x500 at x=200, y=90) -->
  <g transform="translate(200, 90) scale(0.833333)">
    <!-- Radial Ambient Glow -->
    <circle cx="300" cy="300" r="240" fill="url(#mainVtGlow)" />

    <!-- Dual Concentric Chronometer Calibration Rings -->
    <circle cx="300" cy="300" r="250" fill="none" stroke="#8B0A1F" stroke-width="1.5" />
    <circle cx="300" cy="300" r="238" fill="none" stroke="#C8102E" stroke-width="0.75" stroke-opacity="0.4" />

    <!-- 4 Cardinal Alignment Crosshairs -->
    <g stroke="#C8102E" stroke-width="2" stroke-linecap="round">
      <line x1="300" y1="50" x2="300" y2="32" />
      <line x1="300" y1="50" x2="300" y2="32" transform="rotate(90 300 300)" />
      <line x1="300" y1="50" x2="300" y2="32" transform="rotate(180 300 300)" />
      <line x1="300" y1="50" x2="300" y2="32" transform="rotate(270 300 300)" />
    </g>

    <!-- 8 Chronometer Sub-Tick Marks (30 deg intervals) -->
    <g stroke="#8B0A1F" stroke-width="1.2" stroke-linecap="round">
      <line x1="300" y1="50" x2="300" y2="42" transform="rotate(30 300 300)" />
      <line x1="300" y1="50" x2="300" y2="42" transform="rotate(60 300 300)" />
      <line x1="300" y1="50" x2="300" y2="42" transform="rotate(120 300 300)" />
      <line x1="300" y1="50" x2="300" y2="42" transform="rotate(150 300 300)" />
      <line x1="300" y1="50" x2="300" y2="42" transform="rotate(210 300 300)" />
      <line x1="300" y1="50" x2="300" y2="42" transform="rotate(240 300 300)" />
      <line x1="300" y1="50" x2="300" y2="42" transform="rotate(300 300 300)" />
      <line x1="300" y1="50" x2="300" y2="42" transform="rotate(330 300 300)" />
    </g>

    <!-- Ground Shadow -->
    <ellipse cx="300" cy="466" rx="86" ry="9" fill="url(#mainVtShadow)" />

    <!-- Left & Right Athletic Tape Bands -->
    <polygon points="186,160 222,160 300,296.5 300,440 162.8,199.9" fill="url(#mainVtLeft)" />
    <polygon points="414,160 378,160 300,296.5 300,440 437.2,199.9" fill="url(#mainVtRight)" />

    <!-- 3D Bevel Fold Corners -->
    <polygon points="186,160 162.8,199.9 208.8,199.9" fill="url(#mainVtFold)" />
    <polygon points="414,160 437.2,199.9 391.2,199.9" fill="url(#mainVtFold)" />

    <!-- Fold Edges White Highlight -->
    <line x1="186" y1="160" x2="162.8" y2="199.9" stroke="#E8E8E8" stroke-width="1" stroke-opacity="0.7" stroke-linecap="round" />
    <line x1="414" y1="160" x2="437.2" y2="199.9" stroke="#E8E8E8" stroke-width="1" stroke-opacity="0.7" stroke-linecap="round" />

    <!-- Elastic Kinesiology Perforated Stitches -->
    <line x1="212.4" y1="215" x2="300" y2="368.3" stroke="#0A0A0A" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="2 6" stroke-linecap="round" />
    <line x1="387.6" y1="215" x2="300" y2="368.3" stroke="#0A0A0A" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="2 6" stroke-linecap="round" />

    <!-- Specular Outer Edge Lines -->
    <line x1="162.8" y1="199.9" x2="300" y2="440" stroke="#E8E8E8" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
    <line x1="437.2" y1="199.9" x2="300" y2="440" stroke="#E8E8E8" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="300" y1="296.5" x2="300" y2="440" stroke="#E8E8E8" stroke-width="1" stroke-opacity="0.45" />
  </g>

  <!-- Divider Line -->
  <line x1="390" y1="620" x2="510" y2="620" stroke="#C8102E" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round" />

  <!-- Typography: V - Taping -->
  <text x="450" y="700" text-anchor="middle" class="brand-title">
    <tspan fill="#C8102E" font-weight="500">V</tspan>
    <tspan fill="#E8E8E8" font-weight="300"> - </tspan>
    <tspan fill="#F4F4F4" font-weight="300">Taping</tspan>
  </text>
</svg>
