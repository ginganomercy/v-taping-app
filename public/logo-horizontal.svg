<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;800&amp;display=swap');
      .hz-title {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-size: 50px;
        letter-spacing: 0.16em;
      }
      .hz-sub {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-transform: uppercase;
      }
    </style>
    <linearGradient id="hzVtLeft" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#D91B3A" />
      <stop offset="0.55" stop-color="#C8102E" />
      <stop offset="1" stop-color="#8B0A1F" />
    </linearGradient>
    <linearGradient id="hzVtRight" x1="0.85" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#C8102E" />
      <stop offset="0.6" stop-color="#A50D26" />
      <stop offset="1" stop-color="#6E0818" />
    </linearGradient>
    <linearGradient id="hzVtFold" x1="0.15" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B0A1F" />
      <stop offset="1" stop-color="#4A0510" />
    </linearGradient>
    <radialGradient id="hzVtGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.22" />
      <stop offset="1" stop-color="#C8102E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="760" height="220" rx="24" fill="#0A0A0A" />

  <!-- Left Emblem (viewBox 0 0 600 600 scaled to 180x180 at x=20, y=20) -->
  <g transform="translate(20, 20) scale(0.3)">
    <!-- Radial Ambient Glow -->
    <circle cx="300" cy="300" r="240" fill="url(#hzVtGlow)" />

    <!-- Calibration Rings -->
    <circle cx="300" cy="300" r="250" fill="none" stroke="#8B0A1F" stroke-width="2.5" />
    <circle cx="300" cy="300" r="238" fill="none" stroke="#C8102E" stroke-width="1.2" stroke-opacity="0.45" />

    <!-- Crosshairs -->
    <g stroke="#C8102E" stroke-width="3" stroke-linecap="round">
      <line x1="300" y1="50" x2="300" y2="30" />
      <line x1="300" y1="50" x2="300" y2="30" transform="rotate(90 300 300)" />
      <line x1="300" y1="50" x2="300" y2="30" transform="rotate(180 300 300)" />
      <line x1="300" y1="50" x2="300" y2="30" transform="rotate(270 300 300)" />
    </g>

    <!-- Athletic Bands -->
    <polygon points="186,160 222,160 300,296.5 300,440 162.8,199.9" fill="url(#hzVtLeft)" />
    <polygon points="414,160 378,160 300,296.5 300,440 437.2,199.9" fill="url(#hzVtRight)" />

    <!-- Corner Folds -->
    <polygon points="186,160 162.8,199.9 208.8,199.9" fill="url(#hzVtFold)" />
    <polygon points="414,160 437.2,199.9 391.2,199.9" fill="url(#hzVtFold)" />

    <!-- Highlights -->
    <line x1="186" y1="160" x2="162.8" y2="199.9" stroke="#E8E8E8" stroke-width="2" stroke-opacity="0.8" stroke-linecap="round" />
    <line x1="414" y1="160" x2="437.2" y2="199.9" stroke="#E8E8E8" stroke-width="2" stroke-opacity="0.8" stroke-linecap="round" />
    <line x1="162.8" y1="199.9" x2="300" y2="440" stroke="#E8E8E8" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round" />
    <line x1="437.2" y1="199.9" x2="300" y2="440" stroke="#E8E8E8" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" />
    <line x1="300" y1="296.5" x2="300" y2="440" stroke="#E8E8E8" stroke-width="1.8" stroke-opacity="0.5" />

    <!-- Elastic Perforated Stitches -->
    <line x1="212.4" y1="215" x2="300" y2="368.3" stroke="#0A0A0A" stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="2 6" stroke-linecap="round" />
    <line x1="387.6" y1="215" x2="300" y2="368.3" stroke="#0A0A0A" stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="2 6" stroke-linecap="round" />
  </g>

  <!-- Vertical Divider Accent -->
  <line x1="225" y1="45" x2="225" y2="175" stroke="#C8102E" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round" />

  <!-- Horizontal Typography -->
  <text x="260" y="118" class="hz-title">
    <tspan fill="#C8102E" font-weight="700">V</tspan>
    <tspan fill="#E8E8E8" font-weight="300"> - </tspan>
    <tspan fill="#F4F4F4" font-weight="300">TAPING</tspan>
  </text>
  <text x="263" y="152" fill="#888888" class="hz-sub">ATHLETIC KINESIOLOGY &amp; V-TAPER</text>
</svg>
