<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vtLeftApp" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#D91B3A" />
      <stop offset="0.55" stop-color="#C8102E" />
      <stop offset="1" stop-color="#8B0A1F" />
    </linearGradient>
    <linearGradient id="vtRightApp" x1="0.85" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#C8102E" />
      <stop offset="0.6" stop-color="#A50D26" />
      <stop offset="1" stop-color="#6E0818" />
    </linearGradient>
    <linearGradient id="vtFoldApp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B0A1F" />
      <stop offset="1" stop-color="#4A0510" />
    </linearGradient>
    <radialGradient id="vtGlowApp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.16" />
      <stop offset="1" stop-color="#C8102E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vtShadowApp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.45" />
      <stop offset="1" stop-color="#C8102E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Rounded Container -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A" />

  <!-- Centered Graphic: 600x600 scaled to 432x432 (scale 0.72, offset x=40, y=40) -->
  <g transform="translate(40, 40) scale(0.72)">
    <!-- Radial Red Ambient Glow -->
    <circle cx="300" cy="300" r="240" fill="url(#vtGlowApp)" />

    <!-- Dual Concentric Calibration Circles -->
    <circle cx="300" cy="300" r="250" fill="none" stroke="#8B0A1F" stroke-width="2" />
    <circle cx="300" cy="300" r="238" fill="none" stroke="#C8102E" stroke-width="1" stroke-opacity="0.4" />

    <!-- 4 Cardinal Alignment Marks -->
    <g stroke="#C8102E" stroke-width="2.5" stroke-linecap="round">
      <line x1="300" y1="50" x2="300" y2="32" />
      <line x1="300" y1="50" x2="300" y2="32" transform="rotate(90 300 300)" />
      <line x1="300" y1="50" x2="300" y2="32" transform="rotate(180 300 300)" />
      <line x1="300" y1="50" x2="300" y2="32" transform="rotate(270 300 300)" />
    </g>

    <!-- Base Drop Ellipse Shadow -->
    <ellipse cx="300" cy="466" rx="86" ry="9" fill="url(#vtShadowApp)" />

    <!-- Primary Kinesiology Taping Bands -->
    <polygon points="186,160 222,160 300,296.5 300,440 162.8,199.9" fill="url(#vtLeftApp)" />
    <polygon points="414,160 378,160 300,296.5 300,440 437.2,199.9" fill="url(#vtRightApp)" />

    <!-- Geometric Bevel Corner Folds -->
    <polygon points="186,160 162.8,199.9 208.8,199.9" fill="url(#vtFoldApp)" />
    <polygon points="414,160 437.2,199.9 391.2,199.9" fill="url(#vtFoldApp)" />

    <!-- Precision White Specular Edges -->
    <line x1="186" y1="160" x2="162.8" y2="199.9" stroke="#E8E8E8" stroke-width="1.4" stroke-opacity="0.7" stroke-linecap="round" />
    <line x1="414" y1="160" x2="437.2" y2="199.9" stroke="#E8E8E8" stroke-width="1.4" stroke-opacity="0.7" stroke-linecap="round" />

    <!-- Dashed Athletic Elastic Weave -->
    <line x1="212.4" y1="215" x2="300" y2="368.3" stroke="#0A0A0A" stroke-width="1.6" stroke-opacity="0.55" stroke-dasharray="2 6" stroke-linecap="round" />
    <line x1="387.6" y1="215" x2="300" y2="368.3" stroke="#0A0A0A" stroke-width="1.6" stroke-opacity="0.55" stroke-dasharray="2 6" stroke-linecap="round" />

    <!-- Outer Structural Highlights -->
    <line x1="162.8" y1="199.9" x2="300" y2="440" stroke="#E8E8E8" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round" />
    <line x1="437.2" y1="199.9" x2="300" y2="440" stroke="#E8E8E8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="300" y1="296.5" x2="300" y2="440" stroke="#E8E8E8" stroke-width="1.2" stroke-opacity="0.45" />
  </g>
</svg>
