name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Add Android Platform via Capacitor
        run: |
          npx cap add android || true
          if [ -d "android-assets" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp -f android-assets/*.xml android/app/src/main/res/drawable/ || true
          fi
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-taper-athletic-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "V-Taper Protocol ${{ github.ref_name }}"
          body: |
            ## 🚀 V-Taper Protocol - Offline Android APK
            Aplikasi latihan rumah siluet Doritos V-Taper, rehabilitasi lateral hip martials arts, dan pelacak makro nutrisi.
            
            ### Cara Install di HP Android:
            1. Download file `app-debug.apk` di bawah.
            2. Buka file hasil download di HP Anda.
            3. Jika muncul konfirmasi "Install dari sumber tidak dikenal", izinkan peramban/file manager.
            4. Aplikasi langsung terpasang dan siap digunakan $100\%$ offline!
          draft: false
          prerelease: false
