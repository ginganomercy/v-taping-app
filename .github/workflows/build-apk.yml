name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

# Default to least privilege across the entire workflow
permissions:
  contents: read

# Concurrency control: prevent duplicate queued runs and cancel obsolete executions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Typecheck & Compile Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configure Android Native Branding & Permissions
        run: |
          npx cap add android || true

          # 1. Inject GPS & WakeLock Permissions into AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml
          fi

          # 2. Deploy Official Vector Icons & Adaptive Icon XMLs
          if [ -d "android-assets" ]; then
            mkdir -p android/app/src/main/res/drawable
            mkdir -p android/app/src/main/res/drawable-v24
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26

            cp -f android-assets/ic_launcher_background.xml android/app/src/main/res/drawable/
            cp -f android-assets/ic_launcher_foreground.xml android/app/src/main/res/drawable/
            cp -f android-assets/ic_launcher_foreground.xml android/app/src/main/res/drawable-v24/
            cp -f android-assets/logo_v_taping_vector.xml android/app/src/main/res/drawable/

            cp -f android-assets/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            cp -f android-assets/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

            echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0A0A0A</color></resources>' > android/app/src/main/res/values/ic_launcher_background.xml

            # Remove legacy default Capacitor blue foreground PNGs so Android never falls back to them
            find android/app/src/main/res/mipmap-* -name "ic_launcher_foreground.png" -delete || true
          fi

          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: v-taper-athletic-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: Publish Official GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Isolated write permission exclusively for release asset attachment

    steps:
      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: v-taper-athletic-debug.apk
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/app-debug.apk
          name: "V-Taper Protocol ${{ github.ref_name }}"
          body: |
            ## 🚀 V-Taper Protocol ${{ github.ref_name }} - Offline Android APK
            Aplikasi latihan rumah siluet Doritos V-Taper, rehabilitasi sendi panggul lateral (Hip Shield), dan pelacak kardio GPS Zone 2.

            ### 📲 Cara Install di HP Android (termasuk Oppo A5i Pro):
            1. Download file `app-debug.apk` di bawah.
            2. Buka file hasil unduhan di HP Anda.
            3. Jika muncul konfirmasi keamanan "Install dari sumber tidak dikenal", pilih **Izinkan** untuk browser/file manager Anda.
            4. Aplikasi langsung terpasang dan siap digunakan $100\%$ offline!

            ---
            *Verifikasi Keamanan: Paket APK ini dikompilasi secara otomatis melalui GitHub Actions CI/CD Pipeline yang ter-hardening.*
          draft: false
          prerelease: false
